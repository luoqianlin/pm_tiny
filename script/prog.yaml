- name: abnorm_exit_test
  cwd: /opt/pm_tiny/examples
  command: ./bin/abnorm_exit_test
  env_vars:
    []
  kill_timeout_s: 3
  user: ""
  depends_on:
    []
  start_timeout: 0
  failure_action: skip
  daemon: true
  heartbeat_timeout: -1
- name: test_sdk_c
  cwd: /opt/pm_tiny/examples
  command: ./test_sdk_c
  env_vars:
    []
  kill_timeout_s: 3
  user: ""
  depends_on:
    []
  start_timeout: -1
  failure_action: restart
  daemon: true
  heartbeat_timeout: 2
- name: print_env
  cwd: /opt/pm_tiny/examples
  command: ./bin/print_env
  env_vars:
    - Xabc=123
    - Yyy=245
  kill_timeout_s: 3
  user: ""
  depends_on:
    []
  start_timeout: 0
  failure_action: skip
  daemon: true
  heartbeat_timeout: -1
