- name: root
  cwd: "@WORK_DIR@"
  executable: "@WORK_DIR@/sdk_probe"
  args: ["--ready-delay-ms", "3000", "--final-wait-ms", "60000", "--marker", "@WORK_DIR@/root-ready.marker"]
  daemon: false
  start_timeout: 5

- name: child
  cwd: "@WORK_DIR@"
  executable: /system/bin/sleep
  args: ["30"]
  daemon: false
  depends_on:
    - root

- name: grandchild
  cwd: "@WORK_DIR@"
  executable: /system/bin/sleep
  args: ["30"]
  daemon: false
  depends_on:
    - child

- name: bad
  cwd: "@WORK_DIR@"
  executable: "@WORK_DIR@/failable.sh"
  daemon: false

- name: blocked_child
  cwd: "@WORK_DIR@"
  executable: /system/bin/sleep
  args: ["30"]
  daemon: false
  depends_on:
    - bad

- name: blocked_grandchild
  cwd: "@WORK_DIR@"
  executable: /system/bin/sleep
  args: ["30"]
  daemon: false
  depends_on:
    - blocked_child

- name: side
  cwd: "@WORK_DIR@"
  executable: /system/bin/sleep
  args: ["30"]
  daemon: false

- name: timeout_root
  cwd: "@WORK_DIR@"
  executable: "@WORK_DIR@/sdk_probe"
  args: ["--ready-delay-ms", "5000", "--final-wait-ms", "60000", "--marker", "@WORK_DIR@/timeout-ready.marker"]
  daemon: false
  start_timeout: 2

- name: timeout_child
  cwd: "@WORK_DIR@"
  executable: /system/bin/sleep
  args: ["30"]
  daemon: false
  depends_on:
    - timeout_root

- name: heartbeat_skip
  cwd: "@WORK_DIR@"
  executable: "@WORK_DIR@/sdk_probe"
  args: ["--generation-counter", "@WORK_DIR@/heartbeat-skip.count", "--final-wait-ms", "60000"]
  daemon: false
  start_timeout: 2
  heartbeat_timeout: 1
  failure_action: skip

- name: heartbeat_restart
  cwd: "@WORK_DIR@"
  executable: "@WORK_DIR@/sdk_probe"
  args: ["--generation-counter", "@WORK_DIR@/heartbeat-restart.count", "--final-wait-ms", "60000"]
  daemon: false
  start_timeout: 2
  heartbeat_timeout: 1
  failure_action: restart
  restart_delay_ms: 0
  restart_max_delay_ms: 0
