name: build-and-test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test release packaging tools
        run: python3 -m unittest tests/release/test_package_release.py
      - name: Upload Linux failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-artifacts
          path: build/test-artifacts
          if-no-files-found: ignore
          retention-days: 7

  linux-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DPM_TINY_SANITIZER_ENABLE=ON
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build
        run: cmake --build build-sanitized -j2
      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure

  linux-real-cgroup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build cgroup fixtures
        run: cmake --build build --parallel 2 --target pm pm_tiny process_tree_fixture
      - name: Real cgroup v2 regression
        env:
          PM_TINY_TEST_BIN: ${{ github.workspace }}/build
          PM_TINY_REQUIRE_REAL_CGROUP: "1"
          PM_TINY_ALLOW_SUDO: "1"
        run: bash tests/integration/linux/cgroup_v2_integration.sh

  llvm-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM coverage tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Build, test, and report coverage
        env:
          PM_TINY_BUILD_JOBS: "2"
        run: bash scripts/test/coverage.sh
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-coverage
          path: build/test-artifacts/coverage
          if-no-files-found: error
          retention-days: 14

  libfuzzer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run three libFuzzer targets
        env:
          PM_TINY_FUZZ_DURATION: "30"
          PM_TINY_FUZZ_ARTIFACT_DIR: ${{ github.workspace }}/build/test-artifacts/fuzz/libfuzzer
          PM_TINY_BUILD_JOBS: "2"
        run: bash scripts/test/fuzz.sh smoke libfuzzer
      - name: Upload libFuzzer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libfuzzer-smoke
          path: build/test-artifacts/fuzz/libfuzzer
          if-no-files-found: warn
          retention-days: 14

  afl-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install AFL++
        run: sudo apt-get update && sudo apt-get install -y afl++
      - name: Run three AFL++ targets
        env:
          PM_TINY_FUZZ_DURATION: "30"
          PM_TINY_FUZZ_ARTIFACT_DIR: ${{ github.workspace }}/build/test-artifacts/fuzz/afl
          PM_TINY_BUILD_JOBS: "2"
        run: bash scripts/test/fuzz.sh smoke afl
      - name: Upload AFL++ artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afl-smoke
          path: build/test-artifacts/fuzz/afl/*.tar.gz
          if-no-files-found: warn
          retention-days: 14

  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Android NDK
        run: '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393"'
      - name: Build Android Release inputs
        env:
          PM_TINY_ANDROID_RELEASE_BUILD_DIR: ${{ github.workspace }}/build-android
          PM_TINY_ANDROID_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/build-android/release-bin
          PM_TINY_BUILD_JOBS: "2"
        run: >-
          PM_TINY_ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/25.1.8937393"
          bash scripts/release/build-android-release.sh
      - name: Verify Android artifacts
        run: |
          test -x build-android/release-bin/pm_tiny
          test -x build-android/release-bin/pm2
          test ! -e build-android/release-bin/pm

  windows-msvc:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Windows Release inputs
        shell: powershell
        run: >-
          .\scripts\release\build-windows-release.ps1
          -SourceDir $env:GITHUB_WORKSPACE
          -BuildDir "$env:GITHUB_WORKSPACE\build-msvc"
          -OutputDir "$env:GITHUB_WORKSPACE\build-msvc\release-bin"
      - name: Upload Windows MSVC test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-test-artifacts
          path: |
            build-msvc/test-artifacts/windows
            build-msvc/test-artifacts/windows-service
            build-msvc/test-artifacts/windows-lifecycle
            build-msvc/test-artifacts/windows-dependency
            build-msvc/test-artifacts/windows-concurrent
            build-msvc/test-artifacts/windows-release
          if-no-files-found: ignore
          retention-days: 7
